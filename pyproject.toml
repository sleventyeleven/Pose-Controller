[project]
name = "pose-controller"
version = "0.1.0"
description = "Offline, on-device pose/position-triggered media control (Qualcomm NPU MVP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "mediapipe>=0.10",
    "pytest>=8.0",
    # Plain CPU onnxruntime for tracking.reid.ReidEmbedder (person re-ID).
    # On-device this comes transitively via the `device` extra's
    # onnxruntime-qnn (which depends on plain onnxruntime); listed here too
    # so the dev-loop CPU backend can exercise re-ID without installing the
    # much larger onnxruntime-qnn.
    "onnxruntime>=1.20",
]
# Dev-machine only -- pulls in PyTorch to export/quantize models via
# Qualcomm AI Hub's cloud compile service. Never install on the Q6A itself
# (see docs/storage-footprint.md); the device only needs the compiled QNN
# artifacts (models/) plus the `device` extra below. `ultralytics` is a
# separate, fully-local export path (no Qualcomm account needed) used for
# the yolo26 models specifically -- AI Hub's own export failed to compile
# them ("exit code 14"), Ultralytics' own QNN export
# (https://docs.ultralytics.com/integrations/qnn) succeeded where AI Hub
# did not, see docs/backlog.md.
hub = [
    "qai_hub_models",
    "ultralytics",
]
# Q6A-only -- the actual NPU runtime for inference/backends/qnn.py. ~261MB
# installed (see docs/storage-footprint.md) -- large, but replaces a
# subprocess-per-frame approach that was ~150x slower (scripts/qnn_spike.md).
device = [
    "onnxruntime-qnn",
]

[project.scripts]
pose-controller = "pose_controller.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
