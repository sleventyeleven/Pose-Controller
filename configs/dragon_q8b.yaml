# On-device config: Nexigo USB webcam + QNN (Hexagon NPU) pose backend --
# Radxa Dragon Q8B (SC8280XP).
#
# Identical pipeline to configs/dragon_q6a.yaml -- the Q8B shares the Q6A's
# Hexagon V68 architecture (confirmed via `fastrpc_test -a v68` on both,
# see docs/setup-q8b.md) and every model in model_dir/detector_model_dir
# below is already verified running on this board's real NPU unmodified,
# no recompilation needed. Only `overlay.window_name` differs from the
# Q6A config. See docs/setup-q8b.md for board bring-up.
capture:
  source: "0"  # Nexigo webcam as /dev/video0 once moved over from the Q6A; adjust if other capture devices are present
  width: 1280
  height: 720
  fps: 30

inference:
  backend: qnn
  model_dir: models/mediapipe_pose_qcs6490
  detector_model_dir: models/yolov8n_det_qcs6490

overlay:
  show_window: true
  window_name: "Pose-Controller (Q8B)"
