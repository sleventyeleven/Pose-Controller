# On-device config: Nexigo USB webcam + QNN (Hexagon NPU) pose backend.
# See docs/setup-q6a.md for board bring-up and scripts/qnn_spike.md for how
# the models in model_dir were compiled/validated.
capture:
  source: "0"  # Nexigo webcam as /dev/video0; adjust if other capture devices are present
  width: 1280
  height: 720
  fps: 30

inference:
  backend: qnn
  model_dir: models/mediapipe_pose_qcs6490

overlay:
  show_window: true
  window_name: "Pose-Controller (Q6A)"
